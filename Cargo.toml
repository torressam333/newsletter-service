[package]
name = "newsletter-service"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

# We can have multiple binaries but only one lib
[[bin]]
path = "src/main.rs"
name = "newsletter-service"

[dependencies]
reqwest = "0.13.2"
actix-web = "4"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
] }
serde = { version = "1.0.228", features = [
  "derive",
] }
config = "0.15.19"
uuid = { version = "1.20.0", features = [
  "v4",
] }
chrono = { version = "0.4.43", default-features = false, features = [
  "clock",
] }
tracing = { version = "0.1", features = [
  "log",
] }
tracing-subscriber = { version = "0.3", features = [
  "registry",
  "env-filter",
] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
secrecy = { version = "0.10.3", features = [
  "serde",
] }
tracing-actix-web = "0.7"
serde-aux = "4"
unicode-segmentation = "1.12.0"
validator = "0.20.0"

[dev-dependencies]
claims = "0.8.0"
fake = "2.9"
quickcheck = "1.0.3"
quickcheck_macros = "1"
rand = "0.8"

[dependencies.sqlx]
version = "0.8"
default-features = false
features = [
  "runtime-tokio-rustls",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
]
