name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # --- LINT & TEST (OFFLINE) ---
      # We use clippy first because it catches logical errors faster than a full test run.
      - name: Lint (Offline Mode)
        env:
          SQLX_OFFLINE: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (Offline Mode)
        env:
          SQLX_OFFLINE: true
        run: cargo test --all

      # --- SQLX DRIFT CHECK ...NOT IN THE BOOK ---
      # This ensures the committed JSON matches the current code.
      # Note: We use --no-default-features to speed up the install.
      - name: Verify SQLx Metadata (No Drift)
        run: |
          cargo install sqlx-cli --version="~0.8" --no-default-features --features postgres
          cargo sqlx prepare --check -- --all-targets

      - name: Security audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
